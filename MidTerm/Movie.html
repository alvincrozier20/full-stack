<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Horizon</title>

    <style>
        body {
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .container {
            width: 100%;
            min-height: 300px;
        }

        .p {
            display: flex;
            flex-direction: row;
            gap: 10px;
        }

        .play p {
            background-color: white;
            color: black;
            padding: 10px;
            margin: 0;
            border-radius: 4px;
            width: 60px;
            text-align: center;
        }

        .moreinfo p {
            background-color: gray;
            color: white;
            padding: 10px;
            margin: 0;
            border-radius: 4px;
            width: 90px;
            text-align: center;
        }

        h3 {
            color: white;
            margin-top: 30px;
        }

        .trendingnow, .c, .Action {
            display: flex;
            flex-direction: row;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .box {
            min-width: 150px;
            height: 100px;
            background-color: #333;
            border-radius: 5px;
            display: flex;
            align-items: end;
            padding: 10px;
            box-sizing: border-box;
        }

        #box1, #box7, #box13 {
            background: linear-gradient(to top, rgb(223, 82, 82), pink);
        }

        #box2, #box14 {
            background: linear-gradient(to top, rgb(71, 71, 224), rgb(119, 195, 253));
        }

        #box3, #box15 {
            background: linear-gradient(to top, rgb(244, 141, 15), rgb(250, 202, 83));
        }

        #box4, #box16 {
            background: linear-gradient(to top, rgb(217, 34, 245), rgb(131, 48, 226));
        }

        #box5, #box17 {
            background: linear-gradient(to top, rgb(144, 235, 238), rgb(92, 232, 197));
        }

        #box6, #box8, #box18 {
            background: linear-gradient(to top, #444, #999);
        }

        #box9, #box12 {
            background: linear-gradient(to top, #174b35, #52b788);
        }

        #box10 {
            background: linear-gradient(to top, #753b19, #e9a66b);
        }

        #box11 {
            background: linear-gradient(to top, #333366, #7777cc);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Midnight Horizon</h1>

        <p>
            A strange journey into the unknown<br>
            Discover a new world.
        </p>

        <div class="p">
            <div class="play">
                <p>Play</p>
            </div>

            <div class="moreinfo">
                <p>More Info</p>
            </div>
        </div>
    </div>

    <div class="trending">
        <h3>Trending Now</h3>

        <div class="trendingnow">
            <div class="box" id="box1">Movie 1</div>
            <div class="box" id="box2">Movie 2</div>
            <div class="box" id="box3">Movie 3</div>
            <div class="box" id="box4">Movie 4</div>
            <div class="box" id="box5">Movie 5</div>
            <div class="box" id="box6">Movie 6</div>
        </div>

        <h3>Continue Watching</h3>

        <div class="c">
            <div class="box" id="box7">Movie 7</div>
            <div class="box" id="box8">Movie 8</div>
            <div class="box" id="box9">Movie 9</div>
            <div class="box" id="box10">Movie 10</div>
            <div class="box" id="box11">Movie 11</div>
            <div class="box" id="box12">Movie 12</div>
        </div>

        <h3>Action Movies</h3>

        <div class="Action">
            <div class="box" id="box13">Movie 13</div>
            <div class="box" id="box14">Movie 14</div>
            <div class="box" id="box15">Movie 15</div>
            <div class="box" id="box16">Movie 16</div>
            <div class="box" id="box17">Movie 17</div>
            <div class="box" id="box18">Movie 18</div>
        </div>
    </div>

</body>
</html>
