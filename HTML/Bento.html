<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            outline: 2px white;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            grid-template-areas:
                "box1 box1 box2"
                "box1 box1 box7"
                "box3 box4 box7"
                "box3 box6 box7"
                "box5 box6 box7";
            /* grid-template-rows: repeat(3, 1fr); */
            width: 95vw;
            height: 45vw;
            justify-content: center;
            margin: 0 auto;
        }
        .container>div{
            font-size: 30px;
            outline: 1px solid black;
            border-radius: 30px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="grid-area: box1;"></div>
        <div style="grid-area: box2;"></div>
        <div style="grid-area: box3;"></div>
        <div style="grid-area: box4;"></div>
        <div style="grid-area: box5;"></div>
        <div style="grid-area: box6;"></div>
        <div style="grid-area: box7;"></div>
    </div>
</body>
</html>
