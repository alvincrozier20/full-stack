<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Cards</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;

            justify-content: center;
            align-content: center;

            width: 75vw;
            height: 45vw;

            outline: 2px solid black;
        }

        .container > div {
            width: 200px;
            height: 270px;

            margin: 10px;
            padding: 20px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            border: 1px solid black;
            border-radius: 5px;
        }

        .container > div img {
            width: 120px;
            height: 120px;

            object-fit: contain;
        }

        .container > div h3 {
            margin: 10px 0 5px;
        }

        .container > div p {
            margin: 5px;
        }

        .container > div button {
            padding: 8px 15px;
            border: none;
            background-color: black;
            color: white;
            border-radius: 5px;
        }

    </style>
</head>

<body>

    <div class="container">

        <div id="box1">
            <img src="https://via.placeholder.com/120" alt="Product">
            <h3>Product 1</h3>
            <p>₹999</p>

        </div>
