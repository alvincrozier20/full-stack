<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../dist/output.css" rel="stylesheet">
</head>

<body class="bg-gray-100 dark:bg-gray-950 min-h-screen flex items-center justify-center p-6">

  <div
    class="w-full max-w-md 
           bg-white dark:bg-gray-900 
           rounded-xl 
           px-6 py-8 
           border border-gray-200 dark:border-gray-700
           shadow-xl dark:shadow-2xl dark:shadow-black/40
           ring-1 ring-gray-900/5 dark:ring-white/10
           transition duration-300
           hover:shadow-2xl dark:hover:shadow-indigo-500/10"
  >

    <!-- Icon -->
    <div>
      <span
        class="inline-flex items-center justify-center 
               rounded-lg 
               bg-indigo-500 dark:bg-indigo-600
               p-3 
               shadow-lg shadow-indigo-500/30
               dark:shadow-indigo-500/20
               transition
               hover:bg-indigo-600 dark:hover:bg-indigo-500"
      >
        <svg
          class="h-6 w-6 stroke-white"
          fill="none"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 20h9M12 4h9M4 9h16M4 15h16"
          />
        </svg>
      </span>
    </div>

    <!-- Heading -->
    <h3
      class="mt-5 
             text-gray-900 dark:text-white 
             text-lg 
             font-semibold 
             tracking-tight"
    >
      Writes upside-down
    </h3>

    <!-- Description -->
    <p
      class="mt-2 
             text-gray-500 dark:text-gray-400 
             text-sm 
             leading-6"
    >
      The Zero Gravity Pen can be used to write in any orientation,
      including upside-down. It even works in outer space.
    </p>

    <!-- Divider -->
    <div class="my-6 border-t border-gray-200 dark:border-gray-700"></div>

    <!-- Features -->
    <div class="space-y-3">

      <div class="flex items-center gap-3">
        <span class="text-green-500">✓</span>
        <span class="text-gray-700 dark:text-gray-300 text-sm">
          Works in any orientation
        </span>
      </div>

      <div class="flex items-center gap-3">
        <span class="text-green-500">✓</span>
        <span class="text-gray-700 dark:text-gray-300 text-sm">
          Works in outer space
        </span>
      </div>

      <div class="flex items-center gap-3">
        <span class="text-green-500">✓</span>
        <span class="text-gray-700 dark:text-gray-300 text-sm">
          Comfortable to use
        </span>
      </div>

    </div>

    <!-- Button -->
    <button
      class="mt-6 w-full 
             rounded-lg 
             bg-indigo-600 hover:bg-indigo-700
             dark:bg-indigo-500 dark:hover:bg-indigo-600
             px-4 py-2.5
             text-sm font-medium text-white
             shadow-md shadow-indigo-500/20
             transition duration-200
             focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2
             dark:focus:ring-offset-gray-900"
    >
      Learn More
    </button>

  </div>

</body>
</html>
