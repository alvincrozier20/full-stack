<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            background-color: black;
        }
        .box{
            background-color: rgb(28, 27, 27);
            height: 200px;
            width: 500px;
            margin-top: 250px;
            margin-left: 500px;
            border-radius: 10px;
            align-content: center;
        }
        .hp{
             height: 50px;
            width: 400px;
            background-color: white;
            border-radius: 30px;
            margin-left: 47px;
            background: linear-gradient(to right, orange,yellow,white);
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="hp"></div>
    </div>
</body>
</html>
